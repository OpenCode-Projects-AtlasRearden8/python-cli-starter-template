name: lint-and-test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Show version
        run: todolist --version

      - name: Compile check (syntax)
        run: python -m compileall src -q

      - name: Build a real demo smoke test
        run: |
          todolist --dry-run add "smoke item"
          todolist add "smoke item" && test -f todo_items.json
          todolist list
          rm -f todo_items.json todo_items.json.tmp

      - name: Run tests
        run: pytest -v

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
        if: matrix.python-version == '3.13'
